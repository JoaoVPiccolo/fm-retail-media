# Nginx HTTPS reverse proxy for FlexReset (Production)
# - Terminates TLS
# - Serves static frontend (built assets from fm-flexreset-web container)
# - Proxies API and WebSocket traffic to fm-flexreset-api
#
# Expected cert paths (mounted):
#   /etc/ssl/certs/flexreset/fullchain.pem
#   /etc/ssl/private/flexreset/privkey.pem

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream flexreset_api {
  server fm-flexreset-api:3000;
}

upstream flexreset_web {
  server fm-flexreset-web:80;
}

server {
  listen 443 ssl http2;
  server_name _;

  # TLS configuration
  ssl_certificate     /etc/ssl/certs/flexreset/fullchain.pem;
  ssl_certificate_key /etc/ssl/private/flexreset/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE:ECDH:AES256';

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header X-XSS-Protection "1; mode=block";
  add_header Referrer-Policy no-referrer-when-downgrade;

  # Frontend static assets
  location / {
    proxy_pass http://flexreset_web/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    
    # Cache static assets aggressively by extension
    if ($uri ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$) {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }

  # API
  location /api/ {
    proxy_pass http://flexreset_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    
    # Timeouts for long-running operations
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  # WebSocket: device messages
  location /ws/device-messages {
    proxy_pass http://flexreset_api/ws/device-messages;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_read_timeout 600s;
  }

  # WebSocket: device events
  location /ws/device-events {
    proxy_pass http://flexreset_api/ws/device-events;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_read_timeout 600s;
  }

  # Health endpoint
  location = /healthz {
    proxy_pass http://flexreset_api/api/app/health;
  }
}

# HTTP to HTTPS redirect
server {
  listen 80;
  server_name _;
  
  # Allow ACME challenge for Let's Encrypt
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }
  
  # Redirect all other traffic to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}
